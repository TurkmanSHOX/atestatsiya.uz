{% extends "admin/layout.html" %}

{% block title %}Yangi Attestatsiya Yaratish{% endblock %}

{% block admin_content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-2 pb-3 mb-4 border-bottom">
  <div>
    <h1 class="h3 fw-bold text-dark mb-0">Yangi Attestatsiya Yaratish</h1>
    <span class="text-muted small">Imtihon mezonlari, narx va parametrlarini belgilash</span>
  </div>
  <a href="{{ url_for('admin.attestations_list') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i> Ro'yxatga qaytish
  </a>
</div>

<div class="card border rounded-3 p-4 bg-white shadow-sm max-w-900">
  <form method="POST" action="{{ url_for('admin.create_attestation') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label small fw-semibold">Attestatsiya to'liq nomi <span class="text-danger">*</span></label>
        <input type="text" name="title" class="form-control" placeholder="Pedagog kadrlar professional attestatsiyasi" required>
      </div>

      <div class="col-md-4">
        <label class="form-label small fw-semibold">Yo'nalish (Soha) <span class="text-danger">*</span></label>
        <input type="text" name="field_name" class="form-control" placeholder="Pedagogika / IT / Moliya" required>
      </div>

      <div class="col-12">
        <label class="form-label small fw-semibold">Qisqa tavsif <span class="text-danger">*</span></label>
        <textarea name="short_description" class="form-control" rows="2" placeholder="Nomzodlar uchun qisqa izoh..." required></textarea>
      </div>

      <div class="col-12">
        <label class="form-label small fw-semibold">To'liq tavsif va talablar <span class="text-danger">*</span></label>
        <textarea name="full_description" class="form-control" rows="5" placeholder="Batafsil talablar, mezonlar va mavzular..." required></textarea>
      </div>

      <div class="col-md-4">
        <label class="form-label small fw-semibold">Narxi (so'm) <span class="text-danger">*</span></label>
        <input type="number" name="price" class="form-control" value="340000" min="0" required>
      </div>

      <div class="col-md-4">
        <label class="form-label small fw-semibold">Savollar soni <span class="text-danger">*</span></label>
        <input type="number" name="questions_count" class="form-control" value="40" min="5" required>
      </div>

      <div class="col-md-4">
        <label class="form-label small fw-semibold">Imtihon vaqti (daqiqa) <span class="text-danger">*</span></label>
        <input type="number" name="duration_minutes" class="form-control" value="60" min="10" required>
      </div>

      <div class="col-md-4">
        <label class="form-label small fw-semibold">O'tish bali (%) <span class="text-danger">*</span></label>
        <input type="number" name="passing_score" class="form-control" value="60" min="1" max="100" required>
      </div>

      <div class="col-md-4">
        <label class="form-label small fw-semibold">Holati</label>
        <select name="status" class="form-select">
          <option value="ACTIVE" selected>ACTIVE (Faol)</option>
          <option value="DRAFT">DRAFT (Qoralama)</option>
          <option value="PAUSED">PAUSED (To'xtatilgan)</option>
        </select>
      </div>
    </div>

    <div class="mt-4 pt-3 border-top text-end">
      <button type="submit" class="btn btn-gov-primary px-4 fw-bold">
        <i class="bi bi-check2-circle me-1"></i> Saqlash va Faollashtirish
      </button>
    </div>
  </form>
</div>
{% endblock %}
