{% extends "admin/layout.html" %}

{% block title %}Yangi Paket Yaratish{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-4 border-bottom">
  <h1 class="h2 fw-bold text-dark mb-0">Yangi Tayyorgarlik Paketi Yaratish</h1>
  <a href="{{ url_for('admin.packages_list') }}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i> Paketlarga qaytish
  </a>
</div>

<div class="card border-0 shadow-sm rounded-3 p-4 max-w-800">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label fw-bold">Paket nomi <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control" required placeholder="Masalan: 30 kunlik to'liq tayyorgarlik">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-bold">Slug (URL)</label>
        <input type="text" name="slug" class="form-control" placeholder="30-kunlik-paket">
      </div>

      <div class="col-md-4">
        <label class="form-label fw-bold">Narxi (so'm) <span class="text-danger">*</span></label>
        <input type="number" name="price" class="form-control" required value="30000" min="1000" step="1000">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-bold">Amal qilish muddati (kun) <span class="text-danger">*</span></label>
        <input type="number" name="duration_days" class="form-control" required value="30" min="1">
      </div>
      <div class="col-md-4">
        <label class="form-label fw-bold">Testlar soni cheklovi</label>
        <input type="number" name="test_limit" class="form-control" placeholder="Bo'sh qolsa = Cheksiz">
      </div>

      <div class="col-12">
        <div class="form-check form-switch fs-6 mb-2">
          <input class="form-check-input" type="checkbox" name="is_all_subjects" id="isAllSubjects" checked>
          <label class="form-check-label fw-bold" for="isAllSubjects">Barcha fanlar uchun amal qilsin</label>
        </div>
      </div>

      <div class="col-12">
        <label class="form-label fw-bold">Imkoniyatlar (har bir qator alohida imkoniyat)</label>
        <textarea name="features" class="form-control" rows="4" placeholder="Barcha fanlar ochiq&#10;Attestatsiya simulyatsiyalari&#10;Xatolar ustida ishlash&#10;AI tavsiyalar"></textarea>
      </div>

      <div class="col-12">
        <label class="form-label fw-bold">Qisqacha tavsifi</label>
        <textarea name="description" class="form-control" rows="2" placeholder="Tarif haqida umumiy ma'lumot"></textarea>
      </div>
    </div>

    <div class="mt-4 pt-3 border-top">
      <button type="submit" class="btn btn-success fw-bold px-4 py-2">
        <i class="bi bi-save me-1"></i> Paketni saqlash
      </button>
    </div>
  </form>
</div>
{% endblock %}
