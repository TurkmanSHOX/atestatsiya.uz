{% extends "admin/layout.html" %}

{% block title %}Yangi Savol Yaratish{% endblock %}

{% block admin_content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-2 pb-3 mb-4 border-bottom">
  <div>
    <h1 class="h3 fw-bold text-dark mb-0">Yangi Savol Qo'shish</h1>
    <span class="text-muted small">Savollar bankiga yangi test topshirig'i kiritish</span>
  </div>
  <a href="{{ url_for('admin.questions_list') }}" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left me-1"></i> Savollar bankiga qaytish
  </a>
</div>

<div class="card border rounded-3 p-4 bg-white shadow-sm max-w-900">
  <form method="POST" action="{{ url_for('admin.create_question') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label small fw-semibold">Fan <span class="text-danger">*</span></label>
        <select name="subject_id" class="form-select" required>
          {% for s in subjects %}
          <option value="{{ s.id }}">{{ s.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label small fw-semibold">Mavzu <span class="text-danger">*</span></label>
        <select name="topic_id" class="form-select" required>
          {% for t in topics %}
          <option value="{{ t.id }}">{{ t.name }} ({{ t.subject.name if t.subject else '' }})</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label small fw-semibold">Savol turi <span class="text-danger">*</span></label>
        <select name="question_type" class="form-select">
          {% for val, label in q_types %}
          <option value="{{ val }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label small fw-semibold">Qiyinlik darajasi</label>
        <select name="difficulty" class="form-select">
          <option value="EASY">Oson</option>
          <option value="MEDIUM" selected>O'rta</option>
          <option value="HARD">Qiyin</option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label small fw-semibold">Ball qiymati</label>
        <input type="number" step="0.5" name="points" class="form-control" value="1.0" min="0.5" required>
      </div>

      <div class="col-12">
        <label class="form-label small fw-semibold">Savol matni <span class="text-danger">*</span></label>
        <textarea name="text" class="form-control" rows="3" placeholder="Savol matnini kiriting..." required></textarea>
      </div>

      <div class="col-12">
        <label class="form-label small fw-semibold">Izoh yoki yechim tushuntirishi</label>
        <textarea name="explanation" class="form-control" rows="2" placeholder="To'g'ri javob sababi (ixtiyoriy)..."></textarea>
      </div>

      <!-- Variants Section -->
      <div class="col-12 border-top pt-3 mt-4">
        <h6 class="fw-bold text-dark mb-3">Javob variantlari (To'g'ri javobni tanlang):</h6>

        <div class="row g-2 mb-2 align-items-center">
          <div class="col-auto">
            <input class="form-check-input" type="radio" name="correct_opt" value="0" checked required>
            <strong>A)</strong>
          </div>
          <div class="col">
            <input type="text" name="opt_text" class="form-control" placeholder="A variant matni..." required>
          </div>
        </div>

        <div class="row g-2 mb-2 align-items-center">
          <div class="col-auto">
            <input class="form-check-input" type="radio" name="correct_opt" value="1">
            <strong>B)</strong>
          </div>
          <div class="col">
            <input type="text" name="opt_text" class="form-control" placeholder="B variant matni..." required>
          </div>
        </div>

        <div class="row g-2 mb-2 align-items-center">
          <div class="col-auto">
            <input class="form-check-input" type="radio" name="correct_opt" value="2">
            <strong>C)</strong>
          </div>
          <div class="col">
            <input type="text" name="opt_text" class="form-control" placeholder="C variant matni...">
          </div>
        </div>

        <div class="row g-2 mb-2 align-items-center">
          <div class="col-auto">
            <input class="form-check-input" type="radio" name="correct_opt" value="3">
            <strong>D)</strong>
          </div>
          <div class="col">
            <input type="text" name="opt_text" class="form-control" placeholder="D variant matni...">
          </div>
        </div>
      </div>
    </div>

    <div class="mt-4 pt-3 border-top text-end">
      <button type="submit" class="btn btn-gov-primary px-4 fw-bold">
        <i class="bi bi-save me-1"></i> Savolni saqlash
      </button>
    </div>
  </form>
</div>
{% endblock %}
